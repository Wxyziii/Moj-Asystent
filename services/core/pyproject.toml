[project]
name = "moj-asystent-core"
version = "0.1.0"
description = "Local-only FastAPI assistant core and desktop protocol boundary."
readme = "README.md"
authors = [
    { name = "Marcel Bialk", email = "mirekromantik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.3",
    "openwakeword>=0.4.0",
    "piper-tts>=1.8.0",
    "pydantic>=2.13.5",
    "scipy>=1.18.1",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.6",
    "uvicorn>=0.52.4",
    "websockets>=17.1",
]

[project.scripts]
moj-asystent-core = "moj_asystent_core.main:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema[format]>=4.26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]
