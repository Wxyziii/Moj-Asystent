[package]
name = "moj-asystent"
version = "0.1.0"
description = "Desktopowa nakładka aplikacji Mój Asystent"
authors = ["Mój Asystent"]
edition = "2021"

[lib]
name = "moj_asystent_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "moj-asystent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
